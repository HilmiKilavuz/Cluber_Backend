services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  
    container_name: cluber-api-dev
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cluber}:${POSTGRES_PASSWORD:-cluber_secret}@postgres:5432/${POSTGRES_DB:-cluber_db}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001}
      - CHOKIDAR_USEPOLLING=true 
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - .:/app
    command: sh -c "npx prisma generate && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cluber-network

  postgres:
    image: postgres:16-alpine
    container_name: cluber-postgres-dev
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cluber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cluber_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cluber_db}
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cluber} -d ${POSTGRES_DB:-cluber_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cluber-network

  redis:
    image: redis:7-alpine
    container_name: cluber-redis-dev
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cluber-network

volumes:
  dev_postgres_data:
    driver: local
  dev_redis_data:
    driver: local

networks:
  cluber-network:
    driver: bridge
